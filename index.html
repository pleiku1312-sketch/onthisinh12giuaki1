<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Sinh học 12 - Lớp 12A2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mcq-option:checked + div { border-color: #3b82f6; background-color: #eff6ff; }
        .correct-ans { border-color: #22c55e !important; background-color: #f0fdf4 !important; border-width: 2px !important; font-weight: 600; }
        .wrong-ans { border-color: #ef4444 !important; background-color: #fef2f2 !important; color: #b91c1c; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans pb-20">

    <div class="max-w-3xl mx-auto bg-white shadow-md min-h-screen relative">
        <div class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md">
            <h1 class="text-xl font-bold text-center">Hệ thống Ôn tập Sinh 12</h1>
            <p class="text-sm text-center opacity-90">Dành cho học sinh 12A2 - THPT số 2 Nguyễn Thái Học</p>
            <div class="mt-3 flex justify-center">
                <select id="examSelector" class="bg-white text-blue-800 font-semibold py-1 px-3 rounded text-sm w-full max-w-xs shadow" onchange="loadExam()">
                    <option value="0">Đề số 1</option>
                    <option value="1">Đề số 2</option>
                    <option value="2">Đề số 3</option>
                    <option value="3">Đề số 4</option>
                    <option value="4">Đề số 5</option>
                    <option value="5">Đề số 6</option>
                    <option value="6">Đề số 7</option>
                    <option value="7">Đề số 8</option>
                    <option value="8">Đề số 9</option>
                    <option value="9">Đề số 10</option>
                    <option value="10">Đề số 11 (Vận dụng cao - Phân loại)</option>
                </select>
            </div>
        </div>

        <div id="examContent" class="p-4 sm:p-6 space-y-8"></div>

        <div class="p-4 bg-gray-50 border-t flex justify-center sticky bottom-0 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
            <button onclick="submitExam()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform active:scale-95 w-full max-w-xs text-lg">
                Nộp bài & Chấm điểm
            </button>
        </div>
    </div>

    <!-- Custom Modal -->
    <div id="resultModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center transform transition-all scale-95 opacity-0" id="modalContent">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Kết quả của em</h2>
            <div class="text-5xl font-black text-blue-600 mb-4" id="scoreDisplay">0.0</div>
            <div class="text-left text-sm text-gray-600 space-y-1 mb-6 bg-gray-50 p-3 rounded">
                <p>📍 <span id="mcqScore"></span>/4.5 đ (Trắc nghiệm)</p>
                <p>📍 <span id="tfScore"></span>/3.0 đ (Đúng/Sai)</p>
                <p>📍 <span id="saScore"></span>/2.5 đ (Trả lời ngắn)</p>
            </div>
            <button onclick="closeModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-6 rounded-lg w-full">
                Xem lại bài làm (Hiện đáp án)
            </button>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let currentData = { mcq: [], tf: [], sa: [] };
        let originalIndexes = {}; 
        let isSubmitted = false;

        function getSlice(array, start, count) {
            let result = [];
            for (let i = 0; i < count; i++) {
                result.push(array[(start + i) % array.length]);
            }
            return result;
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderImages(imagesArray) {
            if (!imagesArray || imagesArray.length === 0) return '';
            let html = '<div class="my-3 flex flex-wrap gap-2 justify-center">';
            imagesArray.forEach(img => {
                html += `<img src="${img}" class="max-w-full h-auto rounded border shadow-sm" alt="Hình ảnh câu hỏi">`;
            });
            html += '</div>';
            return html;
        }

        function loadExam() {
            isSubmitted = false;
            
            // Wait for data.js to load
            if (!window.examData) {
                setTimeout(loadExam, 100);
                return;
            }

            const examIndex = parseInt(document.getElementById('examSelector').value);
            
            if (examIndex === 10) {
                currentData = window.examData.de11Data;
            } else {
                const mcqCount = 18, tfCount = 3, saCount = 5;
                const mcqStart = (examIndex * mcqCount) % window.examData.tracNghiemData.length;
                const tfStart = (examIndex * tfCount) % window.examData.dungSaiData.length;
                const saStart = (examIndex * saCount) % window.examData.traLoiNganData.length;
                
                currentData = {
                    mcq: getSlice(window.examData.tracNghiemData, mcqStart, mcqCount),
                    tf: getSlice(window.examData.dungSaiData, tfStart, tfCount),
                    sa: getSlice(window.examData.traLoiNganData, saStart, saCount)
                };
            }
            renderExam();
        }

        function renderExam() {
            const container = document.getElementById('examContent');
            container.innerHTML = '';
            originalIndexes = {};

            // Render MCQ
            let html = `<div class="mb-8">
                <h2 class="text-xl font-bold border-b-2 border-blue-500 pb-2 mb-4 text-blue-800 uppercase">Phần I. Trắc nghiệm (4.5đ)</h2>`;
            
            currentData.mcq.forEach((q, idx) => {
                let optionsWithIndex = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                let shuffledOptions = shuffleArray(optionsWithIndex);
                originalIndexes[`mcq_${idx}`] = shuffledOptions.map(o => o.originalIndex); 

                html += `<div class="mb-6 bg-white p-4 rounded-lg border border-gray-100 shadow-sm">
                    <p class="font-semibold text-gray-800 mb-3 whitespace-pre-wrap"><span class="text-blue-600">Câu ${idx + 1}:</span> ${q.question.replace(/^Câu \d+[\.\:]\s*/, '')}</p>
                    ${renderImages(q.images)}
                    <div class="space-y-2">`;
                
                shuffledOptions.forEach((opt, oIdx) => {
                    html += `
                        <label class="block relative cursor-pointer">
                            <input type="radio" name="mcq_${idx}" value="${oIdx}" class="mcq-option sr-only">
                            <div id="mcq_opt_${idx}_${oIdx}" class="p-3 border rounded-md transition-colors text-sm text-gray-700 hover:bg-gray-50">
                                ${opt.text}
                            </div>
                        </label>
                    `;
                });
                html += `</div></div>`;
            });
            html += `</div>`;

            // Render T/F
            html += `<div class="mb-8">
                <h2 class="text-xl font-bold border-b-2 border-blue-500 pb-2 mb-4 text-blue-800 uppercase">Phần II. Đúng/Sai (3.0đ)</h2>
                <p class="text-sm text-gray-500 italic mb-4">Mỗi câu có 4 ý, trả lời đúng 1 ý được 0.1đ, 2 ý 0.25đ, 3 ý 0.5đ, 4 ý 1.0đ.</p>`;
            
            currentData.tf.forEach((q, idx) => {
                html += `<div class="mb-6 bg-white p-4 rounded-lg border border-gray-100 shadow-sm">
                    <p class="font-semibold text-gray-800 mb-3 whitespace-pre-wrap"><span class="text-blue-600">Câu ${idx + 1}:</span> ${q.question.replace(/^Câu \d+[\.\:]\s*/, '')}</p>
                    ${renderImages(q.images)}
                    <div class="space-y-3">`;
                
                q.statements.forEach((stmt, sIdx) => {
                    html += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 border rounded-md bg-gray-50">
                            <p class="text-sm text-gray-700 mb-2 sm:mb-0 sm:mr-4 flex-1">${stmt.text}</p>
                            <div class="flex space-x-2 shrink-0">
                                <label class="cursor-pointer">
                                    <input type="radio" name="tf_${idx}_${sIdx}" value="true" class="peer sr-only">
                                    <div class="w-12 text-center py-1 rounded border peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500 font-medium text-sm transition-colors">Đúng</div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="tf_${idx}_${sIdx}" value="false" class="peer sr-only">
                                    <div class="w-12 text-center py-1 rounded border peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 font-medium text-sm transition-colors">Sai</div>
                                </label>
                            </div>
                            <div id="tf_ans_${idx}_${sIdx}" class="hidden ml-0 sm:ml-2 mt-2 sm:mt-0 text-xs font-bold w-full sm:w-auto text-right sm:text-left"></div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            });
            html += `</div>`;

            // Render Short Answer
            html += `<div class="mb-4">
                <h2 class="text-xl font-bold border-b-2 border-blue-500 pb-2 mb-4 text-blue-800 uppercase">Phần III. Trả lời ngắn (2.5đ)</h2>`;
            
            currentData.sa.forEach((q, idx) => {
                html += `<div class="mb-4 bg-white p-4 rounded-lg border border-gray-100 shadow-sm">
                    <p class="font-semibold text-gray-800 mb-3 whitespace-pre-wrap"><span class="text-blue-600">Câu ${idx + 1}:</span> ${q.question.replace(/^Câu \d+[\.\:]\s*/, '')}</p>
                    ${renderImages(q.images)}
                    <input type="text" id="sa_${idx}" placeholder="Nhập đáp án của em vào đây..." class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none transition-shadow text-gray-800">
                    <p id="sa_ans_${idx}" class="hidden mt-2 text-sm font-semibold text-green-600"></p>
                </div>`;
            });
            html += `</div>`;

            container.innerHTML = html;
            window.scrollTo(0,0);
        }

        function submitExam() {
            isSubmitted = true;
            let totalScore = 0, mcqScore = 0, tfScore = 0, saScore = 0;

            // Chấm MCQ
            currentData.mcq.forEach((q, idx) => {
                const selected = document.querySelector(`input[name="mcq_${idx}"]:checked`);
                let correctRenderIndex = originalIndexes[`mcq_${idx}`].indexOf(q.answer);
                
                for(let i=0; i<4; i++) {
                    let div = document.getElementById(`mcq_opt_${idx}_${i}`);
                    if(div) div.classList.remove('correct-ans', 'wrong-ans');
                }

                if(correctRenderIndex !== -1) {
                   document.getElementById(`mcq_opt_${idx}_${correctRenderIndex}`).classList.add('correct-ans');
                }

                if (selected) {
                    const selectedRenderIndex = parseInt(selected.value);
                    const originalSelectedIndex = originalIndexes[`mcq_${idx}`][selectedRenderIndex];
                    if (originalSelectedIndex === q.answer) {
                        mcqScore += 0.25;
                    } else {
                        document.getElementById(`mcq_opt_${idx}_${selectedRenderIndex}`).classList.add('wrong-ans');
                    }
                }
            });

            // Chấm T/F
            currentData.tf.forEach((q, idx) => {
                let correctCount = 0;
                q.statements.forEach((stmt, sIdx) => {
                    const selected = document.querySelector(`input[name="tf_${idx}_${sIdx}"]:checked`);
                    const ansDiv = document.getElementById(`tf_ans_${idx}_${sIdx}`);
                    
                    ansDiv.classList.remove('hidden', 'text-green-600', 'text-red-500', 'text-gray-500');
                    ansDiv.innerText = stmt.answer ? "(Đáp án: ĐÚNG)" : "(Đáp án: SAI)";
                    
                    if (selected) {
                        if ((selected.value === "true") === stmt.answer) {
                            correctCount++;
                            ansDiv.classList.add('text-green-600');
                        } else {
                            ansDiv.classList.add('text-red-500');
                        }
                    } else {
                         ansDiv.classList.add('text-gray-500');
                    }
                });
                
                if (correctCount === 1) tfScore += 0.1;
                else if (correctCount === 2) tfScore += 0.25;
                else if (correctCount === 3) tfScore += 0.5;
                else if (correctCount === 4) tfScore += 1.0;
            });

            // Chấm SA
            currentData.sa.forEach((q, idx) => {
                const input = document.getElementById(`sa_${idx}`);
                const answer = input.value.trim().toLowerCase();
                const correctAnswer = q.answer.trim().toLowerCase();
                const ansPara = document.getElementById(`sa_ans_${idx}`);
                
                input.classList.remove('border-green-500', 'bg-green-50', 'border-red-500', 'bg-red-50');
                ansPara.classList.remove('hidden');
                ansPara.innerText = "Đáp án chuẩn: " + q.answer;

                if (answer !== "" && answer === correctAnswer) {
                    saScore += 0.5;
                    input.classList.add('border-green-500', 'bg-green-50');
                } else {
                    input.classList.add('border-red-500', 'bg-red-50');
                }
            });

            totalScore = mcqScore + tfScore + saScore;

            // Show Modal
            document.getElementById('mcqScore').innerText = mcqScore.toFixed(2);
            document.getElementById('tfScore').innerText = tfScore.toFixed(2);
            document.getElementById('saScore').innerText = saScore.toFixed(2);
            document.getElementById('scoreDisplay').innerText = totalScore.toFixed(2);
            
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        window.onload = loadExam;
    </script>
</body>
</html>
